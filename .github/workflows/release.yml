# A cada push na main:
#   1. test    — go vet + go test no Windows, sintaxe do setup.ps1 e um
#                --dry-run do executável (consultas reais, nada alterado)
#   2. bump    — commitizen calcula a próxima versão pelos Conventional Commits,
#                atualiza o CHANGELOG.md, cria o commit "bump: ..." e a tag vX.Y.Z
#                (se não houver commit feat/fix/BREAKING, não há release)
#   3. build   — compila o .exe para windows/amd64, empacota um .zip com o
#                executável + estrutura de pastas (OVPN\, logs\) e sobe tudo
#                como artefato
#   4. release — publica a release da tag (.exe solto + pacote .zip) e apaga
#                os artefatos
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    # O commit "bump:" criado pelo próprio workflow não dispara nova release.
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Sintaxe do setup.ps1
        shell: powershell
        run: |
          $erros = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\setup.ps1", [ref]$null, [ref]$erros) | Out-Null
          if ($erros) { $erros | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - name: Smoke test (--version, --list, --dry-run)
        shell: powershell
        run: |
          go build -o post-windows.exe ./cmd/post-windows
          .\post-windows.exe --version
          .\post-windows.exe --list
          if (-not $?) { exit 1 }
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            .\post-windows.exe --dry-run --no-tui --yes --skip windows_update
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "winget não está disponível neste runner: pulando o --dry-run."
          }

  bump:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.cz.outputs.version }}
      bumped: ${{ steps.result.outputs.bumped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: cz
        uses: commitizen-tools/commitizen-action@338bbd841b75aaee6bf5340e1fa12f6ab58ff9ff # 0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog_increment_filename: release-notes.md
      - id: result
        env:
          VERSION: ${{ steps.cz.outputs.version }}
          PREVIOUS: ${{ steps.cz.outputs.previous_version }}
        run: |
          if [ -n "$VERSION" ] && [ "$VERSION" != "$PREVIOUS" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Nova versão: v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum commit feat/fix/BREAKING desde a última versão: sem release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.result.outputs.bumped == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

  build:
    needs: bump
    if: needs.bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.bump.outputs.version }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Compilar
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
          VERSION: v${{ needs.bump.outputs.version }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o dist/post-windows-windows-amd64.exe ./cmd/post-windows
      - name: Empacotar executável + estrutura de pastas
        run: |
          # post-windows/
          #   post-windows.exe  executável
          #   OVPN/README.md    pasta onde ficam os .ovpn a importar
          #   logs/             logs de cada execução
          #   README.md
          pkg="pkg/post-windows"
          mkdir -p "$pkg/OVPN" "$pkg/logs"
          cp dist/post-windows-windows-amd64.exe "$pkg/post-windows.exe"
          cp OVPN/README.md "$pkg/OVPN/README.md"
          cp README.md "$pkg/README.md"
          touch "$pkg/logs/.keep"
          (cd pkg && zip -qr ../dist/post-windows-windows-amd64.zip post-windows)
          cd dist
          sha256sum post-windows-windows-amd64.exe > post-windows-windows-amd64.exe.sha256
          sha256sum post-windows-windows-amd64.zip > post-windows-windows-amd64.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: post-windows-windows-amd64
          path: dist/
          retention-days: 1

  release:
    needs: [bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # apagar os artefatos depois de publicar
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.bump.outputs.version }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file dist/release-notes.md \
            dist/post-windows-windows-*
      - name: Apagar artefatos da action
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: |
            post-windows-windows-*
            release-notes
